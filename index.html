<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NFC Shared Gallery</title>

    <style>

        /* =====================================================
           BASE
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Roboto, sans-serif;

            background-color: #121212;
            color: #E0E0E0;

            padding: 16px;

            text-align: center;

            overflow-x: hidden;
        }

        h1 {
            margin: 8px 0 24px;

            font-weight: 300;
            letter-spacing: 1px;

            color: #FFFFFF;
        }


        /* =====================================================
           PHOTO GRID
        ===================================================== */

        .gallery-grid {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 8px;

            width: 100%;

            max-width: 1600px;

            margin: 0 auto;
        }


        .gallery-grid img {
            display: block;

            width: 100%;

            aspect-ratio: 1 / 1;

            object-fit: cover;

            border-radius: 6px;

            cursor: pointer;

            background-color: #1E1E1E;

            opacity: 0;

            transform: translateY(10px);

            animation:
                fadeInUp
                0.4s
                ease
                forwards;

            transition:
                transform 0.2s ease,
                filter 0.2s ease;
        }


        .gallery-grid img:hover {
            filter: brightness(1.08);
        }


        .gallery-grid img:active {
            transform: scale(0.96);
        }
