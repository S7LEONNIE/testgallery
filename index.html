<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Photo Gallery</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; margin: 0; padding: 20px; text-align: center; }
        h1 { margin-bottom: 20px; font-weight: 400; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; max-width: 800px; margin: 0 auto; }
        .gallery-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; cursor: pointer; transition: transform 0.2s; }
        .gallery-grid img:hover { transform: scale(1.03); }
        .error { color: #ff6b6b; margin-top: 20px; }

        /* 📸 Lightbox Styling */
        .lightbox { display: none; position: fixed; z-index: 999; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); justify-content: center; align-items: center; cursor: pointer; }
        .lightbox img { max-width: 95%; max-height: 90vh; border-radius: 4px; object-fit: contain; }
    </style>
</head>
<body>

    <h1>NFC Shared Gallery</h1>

    <div class="gallery-grid" id="photoGrid"></div>

    <!-- 📸 Lightbox Overlay Element -->
    <div id="lightbox" class="lightbox">
        <img id="lightboxImg" src="" alt="Enlarged view">
    </div>

    <script>
        // 🛠️ CONFIGURATION: Adjusted to your successful repository settings
        const username = "S7LEONNIE"; 
        const repoName = "testgallery"; 
        const folderPath = "images/client1"; // Change to "images/clientname" when scaling for multiple clients

        const grid = document.getElementById('photoGrid');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        
        // This is your exact working API URL structure:
        const apiURL = `https://api.github.com/repos/${username}/${repoName}/contents/${folderPath}`;

        // Supported image formats
        const validExtensions = ['.jpg', '.jpeg', '.png', '.webp', '.gif'];

        async function loadPhotos() {
            try {
                const response = await fetch(apiURL);
                if (!response.ok) throw new Error("Failed to load image folder contents.");
                
                const files = await response.json();

                files.forEach(file => {
                    // Check if the file is an image by looking at its extension
                    const isImage = validExtensions.some(ext => file.name.toLowerCase().endsWith(ext));
                    
                    if (isImage) {
                        const img = document.createElement('img');
                        img.src = `${folderPath}/${file.name}`;
                        img.alt = file.name;
                        img.loading = "lazy";

                        // 📸 Open lightbox on tap/click
                        img.addEventListener('click', () => {
                            lightboxImg.src = img.src;
                            lightbox.style.display = 'flex';
                        });

                        grid.appendChild(img);
                    }
                });
            } catch (error) {
                console.error(error);
                grid.innerHTML = `<p class="error">Oops! Couldn't load the gallery. Double-check your username and repo layout settings.</p>`;
            }
        }

        // 📸 Close lightbox when tapping anywhere on the black overlay
        lightbox.addEventListener('click', () => {
            lightbox.style.display = 'none';
            lightboxImg.src = '';
        });

        loadPhotos();
    </script>

</body>
</html>
