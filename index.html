<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Memories</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: Arial, sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        /* =========================
           PAGE TITLE
        ========================= */

        .page-title {
            text-align: center;
            padding: 30px 20px 20px;
            font-size: 28px;
            font-weight: 600;
        }

        /* =========================
           PHOTO GALLERY
        ========================= */

        .gallery {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 8px 30px;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .gallery img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;

            cursor: pointer;

            opacity: 0;
            transform: translateY(5px);

            transition:
                opacity 0.35s ease,
                transform 0.35s ease;
        }

        .gallery img.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        .gallery img:hover {
            opacity: 0.9;
        }

        @media (min-width: 600px) {
            .gallery {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
                padding-left: 10px;
                padding-right: 10px;
            }
        }

        @media (min-width: 900px) {
            .gallery {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        @media (min-width: 1300px) {
            .gallery {
                grid-template-columns: repeat(6, 1fr);
                gap: 12px;
            }
        }

        /* =========================
           LIGHTBOX
        ========================= */

        .lightbox {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.94);

            display: none;
            align-items: center;
            justify-content: center;

            z-index: 9999;

            opacity: 0;

            touch-action: none;
        }

        .lightbox.active {
            display: flex;
            opacity: 1;
        }

        /* =========================
           LIGHTBOX CONTENT
        ========================= */

        .lightbox-content {
            position: relative;

            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 70px 80px;

            overflow: hidden;

            touch-action: none;
        }

        /* =========================
           LIGHTBOX IMAGE
        ========================= */

        #lightboxImg {
            max-width: 100%;
            max-height: 100%;

            width: auto;
            height: auto;

            object-fit: contain;

            user-select: none;
            -webkit-user-select: none;

            cursor: default;

            transform:
                translate3d(0, 0, 0)
                scale(1);

            transform-origin: center center;

            opacity: 0;

            will-change:
                transform,
                opacity;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        #lightboxImg.show {
            opacity: 1;
        }

        /* =========================
           CLOSE BUTTON
        ========================= */

        .close-button {
            position: absolute;

            top: 18px;
            right: 24px;

            width: 45px;
            height: 45px;

            border: none;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.15);
            color: white;

            font-size: 32px;
            line-height: 1;

            cursor: pointer;

            z-index: 20;

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .close-button:hover {
            background: rgba(255, 255, 255, 0.28);
        }

        .close-button:active {
            transform: scale(0.92);
        }

        /* =========================
           NAVIGATION BUTTONS
        ========================= */

        .nav-button {
            position: absolute;

            top: 50%;
            transform: translateY(-50%);

            width: 50px;
            height: 70px;

            border: none;
            border-radius: 10px;

            background: rgba(255, 255, 255, 0.15);
            color: white;

            font-size: 48px;
            line-height: 1;

            cursor: pointer;

            z-index: 20;

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                background 0.2s ease,
                transform 0.15s ease;
        }

        .nav-button:hover {
            background: rgba(255, 255, 255, 0.28);
        }

        .nav-button:active {
            transform: translateY(-50%) scale(0.92);
        }

        .prev-button {
            left: 20px;
        }

        .next-button {
            right: 20px;
        }

        /* =========================
           PHOTO COUNTER
        ========================= */

        .photo-counter {
            position: absolute;

            bottom: 20px;
            left: 50%;

            transform: translateX(-50%);

            color: white;

            font-size: 14px;

            background: rgba(0, 0, 0, 0.45);

            padding: 7px 12px;

            border-radius: 20px;

            z-index: 20;

            pointer-events: none;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .page-title {
                font-size: 24px;
                padding-top: 24px;
            }

            .lightbox-content {
                padding: 60px 15px;
            }

            .nav-button {
                width: 40px;
                height: 55px;

                font-size: 38px;

                background: rgba(255, 255, 255, 0.12);
            }

            .prev-button {
                left: 8px;
            }

            .next-button {
                right: 8px;
            }

            .close-button {
                top: 12px;
                right: 12px;

                width: 40px;
                height: 40px;

                font-size: 28px;
            }

            .photo-counter {
                bottom: 12px;
                font-size: 13px;
            }
        }
    </style>
</head>


<body>

    <!-- =========================
         PAGE TITLE
    ========================= -->

    <div class="page-title">
        Our Memories
    </div>


    <!-- =========================
         PHOTO GALLERY
    ========================= -->

    <div id="gallery" class="gallery"></div>


    <!-- =========================
         LIGHTBOX
    ========================= -->

    <div id="lightbox" class="lightbox">

        <button
            id="closeButton"
            class="close-button"
            aria-label="Close"
        >
            ×
        </button>


        <button
            id="prevButton"
            class="nav-button prev-button"
            aria-label="Previous photo"
        >
            ‹
        </button>


        <div
            id="lightboxContent"
            class="lightbox-content"
        >

            <img
                id="lightboxImg"
                src=""
                alt="Enlarged memory"
                draggable="false"
            >

        </div>


        <button
            id="nextButton"
            class="nav-button next-button"
            aria-label="Next photo"
        >
            ›
        </button>


        <div
            id="photoCounter"
            class="photo-counter"
        >
            1 / 1
        </div>

    </div>


    <script>

        /* =====================================================
           GITHUB SETTINGS
        ===================================================== */

        const username = "S7LEONNIE";

        const repoName = "testgallery";

        const folderPath = "images/client1";


        /* =====================================================
           GALLERY SETTINGS
        ===================================================== */

        const supportedExtensions = [
            ".jpg",
            ".jpeg",
            ".png",
            ".webp",
            ".gif"
        ];


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const gallery =
            document.getElementById("gallery");

        const lightbox =
            document.getElementById("lightbox");

        const lightboxContent =
            document.getElementById("lightboxContent");

        const lightboxImg =
            document.getElementById("lightboxImg");

        const closeButton =
            document.getElementById("closeButton");

        const prevButton =
            document.getElementById("prevButton");

        const nextButton =
            document.getElementById("nextButton");

        const photoCounter =
            document.getElementById("photoCounter");


        /* =====================================================
           VARIABLES
        ===================================================== */

        let photos = [];

        let currentIndex = 0;


        /* Zoom */

        let scale = 1;

        let translateX = 0;

        let translateY = 0;

        const MIN_SCALE = 1;

        const MAX_SCALE = 4;


        /* Touch */

        let touchStartX = 0;

        let touchStartY = 0;

        let touchCurrentX = 0;

        let touchCurrentY = 0;

        let touchStartTime = 0;

        let isTouching = false;

        let isPinching = false;

        let initialPinchDistance = 0;

        let initialPinchScale = 1;

        let initialPinchCenterX = 0;

        let initialPinchCenterY = 0;


        /* Double tap */

        let lastTapTime = 0;

        let lastTapX = 0;

        let lastTapY = 0;


        /* Dragging */

        let isDragging = false;

        let dragStartX = 0;

        let dragStartY = 0;

        let dragStartTranslateX = 0;

        let dragStartTranslateY = 0;


        /* Navigation animation */

        let isAnimating = false;


        /* =====================================================
           LOAD PHOTOS FROM GITHUB
        ===================================================== */

        async function loadPhotos() {

            try {

                const apiUrl =
                    `https://api.github.com/repos/${username}/${repoName}/contents/${folderPath}`;

                const response =
                    await fetch(apiUrl);

                if (!response.ok) {

                    throw new Error(
                        `GitHub error: ${response.status}`
                    );

                }

                const files =
                    await response.json();


                photos = files.filter(file => {

                    if (file.type !== "file") {
                        return false;
                    }

                    const fileName =
                        file.name.toLowerCase();

                    return supportedExtensions.some(
                        extension =>
                            fileName.endsWith(extension)
                    );

                });


                photos.sort((a, b) =>
                    a.name.localeCompare(b.name)
                );


                photos.forEach((photo, index) => {

                    const img =
                        document.createElement("img");

                    img.src =
                        photo.download_url;

                    img.alt =
                        `Memory ${index + 1}`;

                    img.loading = "lazy";


                    img.addEventListener(
                        "load",
                        () => {
                            img.classList.add("loaded");
                        }
                    );


                    img.addEventListener(
                        "click",
                        () => {
                            openLightbox(index);
                        }
                    );


                    gallery.appendChild(img);

                });


                if (photos.length === 0) {

                    gallery.innerHTML =
                        "<p style='grid-column: 1/-1; text-align:center;'>No photos yet.</p>";

                }

            }

            catch (error) {

                console.error(
                    "Unable to load photos:",
                    error
                );

                gallery.innerHTML =
                    "<p style='grid-column: 1/-1; text-align:center;'>Unable to load photos.</p>";

            }

        }


        /* =====================================================
           OPEN LIGHTBOX
        ===================================================== */

        function openLightbox(index) {

            if (!photos.length) {
                return;
            }


            currentIndex = index;


            resetZoom();


            updateLightbox();


            lightbox.classList.add("active");


            document.body.style.overflow =
                "hidden";

        }


        /* =====================================================
           UPDATE LIGHTBOX
        ===================================================== */

        function updateLightbox() {

            const photo =
                photos[currentIndex];


            resetZoom();


            lightboxImg.classList.remove(
                "show"
            );


            lightboxImg.src =
                photo.download_url;

            lightboxImg.alt =
                photo.name;


            photoCounter.textContent =
                `${currentIndex + 1} / ${photos.length}`;


            if (currentIndex === 0) {

                prevButton.style.display =
                    "none";

            } else {

                prevButton.style.display =
                    "flex";

            }


            if (
                currentIndex ===
                photos.length - 1
            ) {

                nextButton.style.display =
                    "none";

            } else {

                nextButton.style.display =
                    "flex";

            }


            lightboxImg.onload = () => {

                requestAnimationFrame(() => {

                    lightboxImg.classList.add(
                        "show"
                    );

                });

            };


            preloadAdjacentImages();

        }


        /* =====================================================
           PRELOAD ADJACENT IMAGES
        ===================================================== */

        function preloadAdjacentImages() {

            if (currentIndex > 0) {

                const previousImage =
                    new Image();

                previousImage.src =
                    photos[
                        currentIndex - 1
                    ].download_url;

            }


            if (
                currentIndex <
                photos.length - 1
            ) {

                const nextImage =
                    new Image();

                nextImage.src =
                    photos[
                        currentIndex + 1
                    ].download_url;

            }

        }


        /* =====================================================
           NEXT PHOTO
        ===================================================== */

        function showNext() {

            if (
                currentIndex >=
                photos.length - 1
            ) {
                return;
            }


            if (isAnimating) {
                return;
            }


            navigateTo(
                currentIndex + 1,
                "next"
            );

        }


        /* =====================================================
           PREVIOUS PHOTO
        ===================================================== */

        function showPrevious() {

            if (currentIndex <= 0) {
                return;
            }


            if (isAnimating) {
                return;
            }


            navigateTo(
                currentIndex - 1,
                "previous"
            );

        }


        /* =====================================================
           NAVIGATION ANIMATION
        ===================================================== */

        function navigateTo(
            newIndex,
            direction
        ) {

            if (
                newIndex < 0 ||
                newIndex >= photos.length
            ) {
                return;
            }


            isAnimating = true;


            const directionMultiplier =
                direction === "next"
                    ? -1
                    : 1;


            lightboxImg.style.transition =
                "transform 0.18s ease, opacity 0.18s ease";


            lightboxImg.style.transform =
                `translate3d(${directionMultiplier * 80}px, 0, 0) scale(${scale})`;

            lightboxImg.style.opacity =
                "0";


            setTimeout(() => {

                currentIndex =
                    newIndex;


                scale = 1;

                translateX = 0;

                translateY = 0;


                lightboxImg.style.transition =
                    "none";


                lightboxImg.style.transform =
                    `translate3d(${directionMultiplier * -80}px, 0, 0) scale(1)`;


                updateLightbox();


                requestAnimationFrame(() => {

                    lightboxImg.style.transition =
                        "transform 0.22s ease, opacity 0.22s ease";

                    lightboxImg.style.transform =
                        "translate3d(0, 0, 0) scale(1)";

                    lightboxImg.style.opacity =
                        "1";

                });


                setTimeout(() => {

                    isAnimating = false;

                }, 230);

            }, 180);

        }


        /* =====================================================
           CLOSE LIGHTBOX
        ===================================================== */

        function closeLightbox() {

            lightbox.classList.remove(
                "active"
            );


            document.body.style.overflow =
                "";


            resetZoom();

        }


        /* =====================================================
           RESET ZOOM
        ===================================================== */

        function resetZoom() {

            scale = 1;

            translateX = 0;

            translateY = 0;


            lightboxImg.style.transition =
                "transform 0.2s ease";


            lightboxImg.style.transform =
                "translate3d(0, 0, 0) scale(1)";

        }


        /* =====================================================
           APPLY TRANSFORM
        ===================================================== */

        function applyTransform(
            animated = false
        ) {

            lightboxImg.style.transition =
                animated
                    ? "transform 0.2s ease"
                    : "none";


            lightboxImg.style.transform =
                `translate3d(${translateX}px, ${translateY}px, 0) scale(${scale})`;

        }


        /* =====================================================
           DOUBLE TAP ZOOM
        ===================================================== */

        function toggleDoubleTapZoom(
            x,
            y
        ) {

            if (scale === 1) {

                scale = 2.5;

                translateX = 0;

                translateY = 0;

                applyTransform(true);

            } else {

                resetZoom();

            }

        }


        /* =====================================================
           MOUSE WHEEL ZOOM
        ===================================================== */

        lightboxContent.addEventListener(
            "wheel",
            (event) => {

                if (
                    !lightbox.classList.contains(
                        "active"
                    )
                ) {
                    return;
                }


                event.preventDefault();


                const zoomAmount =
                    event.deltaY < 0
                        ? 0.25
                        : -0.25;


                scale += zoomAmount;


                scale = Math.max(
                    MIN_SCALE,
                    Math.min(
                        MAX_SCALE,
                        scale
                    )
                );


                if (scale === 1) {

                    translateX = 0;

                    translateY = 0;

                }


                applyTransform(true);

            },
            {
                passive: false
            }
        );


        /* =====================================================
           DESKTOP MOUSE DRAG
        ===================================================== */

        lightboxImg.addEventListener(
            "mousedown",
            (event) => {

                if (scale <= 1) {
                    return;
                }


                event.preventDefault();


                isDragging = true;


                dragStartX =
                    event.clientX;

                dragStartY =
                    event.clientY;


                dragStartTranslateX =
                    translateX;

                dragStartTranslateY =
                    translateY;


                lightboxImg.style.cursor =
                    "grabbing";

            }
        );


        document.addEventListener(
            "mousemove",
            (event) => {

                if (!isDragging) {
                    return;
                }


                translateX =
                    dragStartTranslateX +
                    (
                        event.clientX -
                        dragStartX
                    );


                translateY =
                    dragStartTranslateY +
                    (
                        event.clientY -
                        dragStartY
                    );


                applyTransform(false);

            }
        );


        document.addEventListener(
            "mouseup",
            () => {

                if (!isDragging) {
                    return;
                }


                isDragging = false;


                lightboxImg.style.cursor =
                    "default";

            }
        );


        /* =====================================================
           TOUCH START
        ===================================================== */

        lightboxContent.addEventListener(
            "touchstart",
            (event) => {

                if (
                    !lightbox.classList.contains(
                        "active"
                    )
                ) {
                    return;
                }


                if (
                    event.touches.length === 2
                ) {

                    isPinching = true;

                    isTouching = false;


                    initialPinchDistance =
                        getTouchDistance(
                            event.touches[0],
                            event.touches[1]
                        );


                    initialPinchScale =
                        scale;


                    const center =
                        getTouchCenter(
                            event.touches[0],
                            event.touches[1]
                        );


                    initialPinchCenterX =
                        center.x;

                    initialPinchCenterY =
                        center.y;


                    return;

                }


                if (
                    event.touches.length !== 1
                ) {
                    return;
                }


                const touch =
                    event.touches[0];


                touchStartX =
                    touch.clientX;

                touchStartY =
                    touch.clientY;


                touchCurrentX =
                    touch.clientX;

                touchCurrentY =
                    touch.clientY;


                touchStartTime =
                    Date.now();


                isTouching = true;


                if (scale > 1) {

                    isDragging = true;

                    dragStartX =
                        touch.clientX;

                    dragStartY =
                        touch.clientY;

                    dragStartTranslateX =
                        translateX;

                    dragStartTranslateY =
                        translateY;

                }

            },
            {
                passive: false
            }
        );


        /* =====================================================
           TOUCH MOVE
        ===================================================== */

        lightboxContent.addEventListener(
            "touchmove",
            (event) => {

                event.preventDefault();


                /* PINCH */

                if (
                    event.touches.length === 2
                ) {

                    isPinching = true;


                    const currentDistance =
                        getTouchDistance(
                            event.touches[0],
                            event.touches[1]
                        );


                    if (
                        initialPinchDistance === 0
                    ) {
                        return;
                    }


                    const pinchRatio =
                        currentDistance /
                        initialPinchDistance;


                    scale =
                        initialPinchScale *
                        pinchRatio;


                    scale = Math.max(
                        MIN_SCALE,
                        Math.min(
                            MAX_SCALE,
                            scale
                        )
                    );


                    if (scale === 1) {

                        translateX = 0;

                        translateY = 0;

                    }


                    applyTransform(false);


                    return;

                }


                /* SINGLE FINGER */

                if (
                    event.touches.length !== 1 ||
                    !isTouching
                ) {
                    return;
                }


                const touch =
                    event.touches[0];


                touchCurrentX =
                    touch.clientX;

                touchCurrentY =
                    touch.clientY;


                const deltaX =
                    touchCurrentX -
                    touchStartX;


                const deltaY =
                    touchCurrentY -
                    touchStartY;


                /* If zoomed:
                   drag image */

                if (scale > 1) {

                    translateX =
                        dragStartTranslateX +
                        deltaX;

                    translateY =
                        dragStartTranslateY +
                        deltaY;


                    applyTransform(false);


                    return;

                }


                /* If not zoomed:
                   keep image completely static while
                   detecting the swipe gesture */

                lightboxImg.style.transition = "none";
                lightboxImg.style.transform = "translate3d(0, 0, 0) scale(1)";

            },
            {
                passive: false
            }
        );


        /* =====================================================
           TOUCH END
        ===================================================== */

        lightboxContent.addEventListener(
            "touchend",
            (event) => {

                if (isPinching) {

                    if (
                        scale <= 1
                    ) {

                        resetZoom();

                    }


                    isPinching = false;

                    isTouching = false;

                    isDragging = false;

                    return;

                }


                if (!isTouching) {
                    return;
                }


                const deltaX =
                    touchCurrentX -
                    touchStartX;

                const deltaY =
                    touchCurrentY -
                    touchStartY;


                const distance =
                    Math.sqrt(
                        deltaX * deltaX +
                        deltaY * deltaY
                    );


                const duration =
                    Date.now() -
                    touchStartTime;


                isTouching = false;


                /* ==========================================
                   ZOOMED IMAGE
                ========================================== */

                if (scale > 1) {

                    isDragging = false;

                    return;

                }


                /* ==========================================
                   DOUBLE TAP
                ========================================== */

                const now =
                    Date.now();


                const timeSinceLastTap =
                    now - lastTapTime;


                const distanceFromLastTap =
                    Math.sqrt(
                        Math.pow(
                            touchStartX -
                            lastTapX,
                            2
                        ) +
                        Math.pow(
                            touchStartY -
                            lastTapY,
                            2
                        )
                    );


                if (
                    timeSinceLastTap < 300 &&
                    distanceFromLastTap < 40
                ) {

                    toggleDoubleTapZoom(
                        touchStartX,
                        touchStartY
                    );


                    lastTapTime = 0;

                    return;

                }


                lastTapTime = now;

                lastTapX = touchStartX;

                lastTapY = touchStartY;


                /* ==========================================
                   SWIPE
                ========================================== */

                const horizontalSwipe =
                    Math.abs(deltaX) > 60 &&
                    Math.abs(deltaX) >
                        Math.abs(deltaY);


                const verticalSwipe =
                    Math.abs(deltaY) > 80 &&
                    Math.abs(deltaY) >
                        Math.abs(deltaX);


                if (
                    horizontalSwipe &&
                    duration < 700
                ) {

                    if (deltaX < 0) {

                        showNext();

                    } else {

                        showPrevious();

                    }


                    return;

                }


                /* ==========================================
                   SWIPE DOWN TO CLOSE
                ========================================== */

                if (
                    verticalSwipe &&
                    deltaY > 80 &&
                    duration < 700
                ) {

                    closeLightbox();

                    return;

                }


                /* ==========================================
                   KEEP IMAGE CENTERED
                ========================================== */

                if (scale === 1) {
                    lightboxImg.style.transition = "transform 0.2s ease";
                    lightboxImg.style.transform = "translate3d(0, 0, 0) scale(1)";

                }

            },
            {
                passive: false
            }
        );


        /* =====================================================
           TOUCH CANCEL
        ===================================================== */

        lightboxContent.addEventListener(
            "touchcancel",
            () => {

                isTouching = false;

                isPinching = false;

                isDragging = false;


                if (scale === 1) {
                    applyTransform(true);
                }

            }
        );


        /* =====================================================
           TOUCH DISTANCE
        ===================================================== */

        function getTouchDistance(
            touch1,
            touch2
        ) {

            const dx =
                touch1.clientX -
                touch2.clientX;

            const dy =
                touch1.clientY -
                touch2.clientY;


            return Math.sqrt(
                dx * dx +
                dy * dy
            );

        }


        /* =====================================================
           TOUCH CENTER
        ===================================================== */

        function getTouchCenter(
            touch1,
            touch2
        ) {

            return {

                x:
                    (
                        touch1.clientX +
                        touch2.clientX
                    ) / 2,

                y:
                    (
                        touch1.clientY +
                        touch2.clientY
                    ) / 2

            };

        }


        /* =====================================================
           BUTTON EVENTS
        ===================================================== */

        closeButton.addEventListener(
            "click",
            closeLightbox
        );


        prevButton.addEventListener(
            "click",
            showPrevious
        );


        nextButton.addEventListener(
            "click",
            showNext
        );


        /* =====================================================
           CLICK DARK BACKGROUND TO CLOSE
        ===================================================== */

        lightbox.addEventListener(
            "click",
            (event) => {

                if (
                    event.target === lightbox
                ) {

                    closeLightbox();

                }

            }
        );


        /* =====================================================
           KEYBOARD
        ===================================================== */

        document.addEventListener(
            "keydown",
            (event) => {

                if (
                    !lightbox.classList.contains(
                        "active"
                    )
                ) {

                    return;

                }


                if (
                    event.key === "Escape"
                ) {

                    closeLightbox();

                    return;

                }


                if (
                    event.key === "ArrowRight"
                ) {

                    showNext();

                    return;

                }


                if (
                    event.key === "ArrowLeft"
                ) {

                    showPrevious();

                    return;

                }

            }
        );


        /* =====================================================
           START
        ===================================================== */

        loadPhotos();

    </script>

</body>
</html>
