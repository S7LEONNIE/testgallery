<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Photo Gallery</title>
    <style>
        /* 🎨 THEME COLORS: Soft matte charcoal and slate gray tones */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #121212; /* Deep matte black background */
            color: #E0E0E0; /* Soft white text */
            margin: 0; 
            padding: 16px; 
            text-align: center; 
        }
        h1 { 
            margin-bottom: 24px; 
            font-weight: 300; 
            letter-spacing: 1px;
            color: #FFFFFF;
        }

        /* 📐 GRID SYSTEM: Strict 3 items per row on mobile screens */
        .gallery-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); /* Forces exactly 3 columns side-by-side */
            gap: 8px; /* Compact padding between images */
            max-width: 600px; 
            margin: 0 auto; 
        }
        .gallery-grid img { 
            width: 100%; 
            aspect-ratio: 1; 
            object-fit: cover; 
            border-radius: 6px; 
            cursor: pointer; 
            background-color: #1E1E1E; /* Placeholder background color while downloading */
            
            /* ✨ Smooth fade-in and scale effects */
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInUp 0.4s ease forwards;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        
        /* Subtle interactive tap effect */
        .gallery-grid img:active { 
            transform: scale(0.96); 
        }

        /* 📸 LIGHTBOX OVERLAY: Fullscreen pop-up styling */
        .lightbox { 
            display: none; 
            position: fixed; 
            z-index: 999; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(10, 10, 10, 0.95); 
            justify-content: center; 
            align-items: center; 
            cursor: pointer;
            
            /* ✨ Smooth fading for background element */
            opacity: 0;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .lightbox.active {
            display: flex;
            opacity: 1;
        }
        
        /* 📸 LIGHTBOX ENLARGED IMAGE: Scaling transitions */
        .lightbox img { 
            max-width: 92%; 
            max-height: 85vh; 
            border-radius: 6px; 
            object-fit: contain; 
            
            /* ✨ Smooth zoom animation for active state */
            transform: scale(0.85);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); /* Bouncy physics curve */
        }
        .lightbox.active img {
            transform: scale(1);
        }

        .error { color: #ff8888; margin-top: 20px; }

        /* ✨ Keyframe Grid Entry Animation */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <h1>NFC Shared Gallery</h1>

    <div class="gallery-grid" id="photoGrid"></div>

    <!-- 📸 Lightbox Overlay Element -->
    <div id="lightbox" class="lightbox">
        <img id="lightboxImg" src="" alt="Enlarged view">
    </div>

    <script>
        // 🛠️ CONFIGURATION: Adjusted to your successful repository settings
        const username = "S7LEONNIE"; 
        const repoName = "testgallery"; 
        const folderPath = "images/client1"; // Change to "images/clientname" when scaling for multiple clients

        const grid = document.getElementById('photoGrid');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        
        // This is your exact working API URL structure:
        const apiURL = `https://api.github.com/repos/${username}/${repoName}/contents/${folderPath}`;

        // Supported image formats
        const validExtensions = ['.jpg', '.jpeg', '.png', '.webp', '.gif'];

        async function loadPhotos() {
            try {
                const response = await fetch(apiURL);
                if (!response.ok) throw new Error("Failed to load image folder contents.");
                
                const files = await response.json();

                files.forEach(file => {
                    // Check if the file is an image by looking at its extension
                    const isImage = validExtensions.some(ext => file.name.toLowerCase().endsWith(ext));
                    
                    if (isImage) {
                        const img = document.createElement('img');
                        img.src = `${folderPath}/${file.name}`;
                        img.alt = file.name;
                        img.loading = "lazy";

                        // 📸 Open lightbox on tap/click
                        img.addEventListener('click', () => {
                            lightboxImg.src = img.src;
                            lightbox.style.display = 'flex';
                        });

                        grid.appendChild(img);
                    }
                });
            } catch (error) {
                console.error(error);
                grid.innerHTML = `<p class="error">Oops! Couldn't load the gallery. Double-check your username and repo layout settings.</p>`;
            }
        }

        // 📸 Close lightbox when tapping anywhere on the black overlay
        lightbox.addEventListener('click', () => {
            lightbox.style.display = 'none';
            lightboxImg.src = '';
        });

        loadPhotos();
    </script>

</body>
</html>
