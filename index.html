    <meta charset="UTF-8">

    <title>NFC Shared Gallery</title>

    <style>
        /* =========================================================
           🎨 BASE THEME
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, sans-serif;

            background: #121212;
            color: #E0E0E0;

            padding: 16px;
            text-align: center;

            overflow-x: hidden;
        }

        h1 {
            margin: 8px 0 24px;

            font-weight: 300;
            letter-spacing: 1px;

            color: #FFFFFF;
        }


        /* =========================================================
           📸 RESPONSIVE PHOTO GRID
        ========================================================= */

        .gallery-grid {
            display: grid;

            /* Mobile default */
            grid-template-columns: repeat(3, minmax(0, 1fr));

            gap: 8px;

            width: 100%;
            max-width: 1600px;

            margin: 0 auto;
        }

        .gallery-grid img {
            display: block;

            width: 100%;
            aspect-ratio: 1 / 1;

            object-fit: cover;

            border-radius: 6px;

            cursor: pointer;

            background: #1E1E1E;

            opacity: 0;
            transform: translateY(12px) scale(0.98);

            animation: galleryFadeIn 0.45s ease forwards;

            transition:
                transform 0.2s ease,
                filter 0.2s ease;
        }

        /* Slight interaction when tapping a thumbnail */

        .gallery-grid img:active {
            transform: scale(0.94);
        }

        .gallery-grid img:hover {
            filter: brightness(1.08);
        }


        /* =========================================================
           📱 TABLET
        ========================================================= */

        @media (min-width: 600px) {
            .gallery-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 10px;
            }
        }


        /* =========================================================
           💻 DESKTOP
        ========================================================= */

        @media (min-width: 900px) {
            body {
                padding: 24px;
            }

            .gallery-grid {
                grid-template-columns: repeat(5, minmax(0, 1fr));
                gap: 12px;
            }
        }


        /* =========================================================
           🖥️ LARGE DESKTOP
        ========================================================= */

        @media (min-width: 1300px) {
            .gallery-grid {
                grid-template-columns: repeat(6, minmax(0, 1fr));
            }
        }


        /* =========================================================
           ✨ THUMBNAIL ENTRANCE ANIMATION
        ========================================================= */

        @keyframes galleryFadeIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        /* =========================================================
           📸 LIGHTBOX
        ========================================================= */

        .lightbox {
            position: fixed;

            inset: 0;

            z-index: 9999;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 24px;

            background: rgba(8, 8, 8, 0.94);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            cursor: zoom-out;

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.35s ease,
                visibility 0.35s ease;
        }


        /* =========================================================
           🖼️ LIGHTBOX IMAGE
        ========================================================= */

        .lightbox img {
            display: block;

            max-width: 94vw;
            max-height: 88vh;

            width: auto;
            height: auto;

            object-fit: contain;

            border-radius: 8px;

            box-shadow:
                0 20px 70px rgba(0, 0, 0, 0.65);

            cursor: default;

            /* Starting state */
            opacity: 0;

            transform:
                scale(0.72)
                translateY(20px);

            transition:
                transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.3s ease;
        }


        /* =========================================================
           ✨ ACTIVE LIGHTBOX ANIMATION
        ========================================================= */

        .lightbox.active {
            opacity: 1;
            visibility: visible;
        }

        .lightbox.active img {
            opacity: 1;

            transform:
                scale(1)
                translateY(0);
        }


        /* =========================================================
           ❌ CLOSE HINT
        ========================================================= */

        .lightbox::after {
            content: "✕";

            position: absolute;

            top: 20px;
            right: 24px;

            width: 40px;
            height: 40px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.08);

            color: rgba(255, 255, 255, 0.85);

            font-size: 20px;
            font-weight: 300;

            pointer-events: none;

            opacity: 0;

            transform: scale(0.8);

            transition:
                opacity 0.3s ease 0.15s,
                transform 0.3s ease 0.15s;
        }

        .lightbox.active::after {
            opacity: 1;
            transform: scale(1);
        }


        /* =========================================================
           ⚠️ ERROR MESSAGE
        ========================================================= */

        .error {
            grid-column: 1 / -1;

            color: #999;

            padding: 40px 20px;
        }


        /* =========================================================
           📱 MOBILE LIGHTBOX
        ========================================================= */

        @media (max-width: 600px) {

            .lightbox {
                padding: 12px;
            }

            .lightbox img {
                max-width: 96vw;
                max-height: 84vh;

                border-radius: 6px;
            }

            .lightbox::after {
                top: 14px;
                right: 14px;
            }
        }


        /* =========================================================
           ♿ REDUCE MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
