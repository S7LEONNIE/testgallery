<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NFC Shared Gallery</title>

    <style>
        /* =====================================================
           BASE
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Roboto, sans-serif;

            background-color: #121212;
            color: #E0E0E0;

            padding: 16px;

            text-align: center;
        }

        h1 {
            margin: 8px 0 24px;

            font-weight: 300;
            letter-spacing: 1px;

            color: #FFFFFF;
        }


        /* =====================================================
           PHOTO GRID
           ===================================================== */

        .gallery-grid {
            display: grid;

            /* 3 columns on mobile */
            grid-template-columns: repeat(3, minmax(0, 1fr));

            gap: 8px;

            width: 100%;
            max-width: 1600px;

            margin: 0 auto;
        }

        .gallery-grid img {
            display: block;

            width: 100%;
            aspect-ratio: 1 / 1;

            object-fit: cover;

            border-radius: 6px;

            cursor: pointer;

            background-color: #1E1E1E;

            opacity: 0;

            transform: translateY(10px);

            animation: fadeInUp 0.4s ease forwards;

            transition:
                transform 0.2s ease,
                filter 0.2s ease;
        }

        .gallery-grid img:hover {
            filter: brightness(1.08);
        }

        .gallery-grid img:active {
            transform: scale(0.96);
        }


        /* =====================================================
           TABLET
           ===================================================== */

        @media (min-width: 600px) {
            .gallery-grid {
                grid-template-columns:
                    repeat(4, minmax(0, 1fr));

                gap: 10px;
            }
        }


        /* =====================================================
           DESKTOP
           ===================================================== */

        @media (min-width: 900px) {
            .gallery-grid {
                grid-template-columns:
                    repeat(5, minmax(0, 1fr));

                gap: 12px;
            }
        }


        /* =====================================================
           LARGE DESKTOP
           ===================================================== */

        @media (min-width: 1300px) {
            .gallery-grid {
                grid-template-columns:
                    repeat(6, minmax(0, 1fr));
            }
        }


        /* =====================================================
           THUMBNAIL ANIMATION
           ===================================================== */

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =====================================================
           LIGHTBOX
           ===================================================== */

        .lightbox {
            display: none;

            position: fixed;

            z-index: 9999;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(5, 5, 5, 0.94);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            justify-content: center;
            align-items: center;

            cursor: zoom-out;

            opacity: 0;
        }


        /* =====================================================
           LIGHTBOX ACTIVE
           ===================================================== */

        .lightbox.active {
            display: flex;

            animation: lightboxFadeIn 0.3s ease forwards;
        }


        /* =====================================================
           ENLARGED IMAGE
           ===================================================== */

        .lightbox img {
            max-width: 92%;
            max-height: 85vh;

            width: auto;
            height: auto;

            object-fit: contain;

            border-radius: 8px;

            cursor: default;

            box-shadow:
                0 20px 70px rgba(0, 0, 0, 0.65);

            opacity: 0;

            transform:
                scale(0.75)
                translateY(20px);

            animation:
                lightboxImageIn
                0.45s
                cubic-bezier(0.22, 1, 0.36, 1)
                0.05s
                forwards;
        }


        /* =====================================================
           LIGHTBOX BACKGROUND ANIMATION
           ===================================================== */

        @keyframes lightboxFadeIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }


        /* =====================================================
           IMAGE EXPANSION ANIMATION
           ===================================================== */

        @keyframes lightboxImageIn {

            0% {
                opacity: 0;

                transform:
                    scale(0.70)
                    translateY(25px);
            }

            70% {
                opacity: 1;

                transform:
                    scale(1.03)
                    translateY(0);
            }

            100% {
                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);
            }
        }


        /* =====================================================
           CLOSE BUTTON
           ===================================================== */

        .lightbox::after {
            content: "×";

            position: absolute;

            top: 18px;
            right: 22px;

            width: 42px;
            height: 42px;

            display: flex;

            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.10);

            color: #FFFFFF;

            font-size: 28px;
            font-weight: 200;

            cursor: pointer;

            opacity: 0;

            animation:
                closeButtonIn
                0.3s
                ease
                0.15s
                forwards;
        }

        @keyframes closeButtonIn {

            from {
                opacity: 0;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }


        /* =====================================================
           ERROR
           ===================================================== */

        .error {
            grid-column: 1 / -1;

            padding: 40px 20px;

            color: #999;
        }


        /* =====================================================
           MOBILE LIGHTBOX
           ===================================================== */

        @media (max-width: 600px) {

            .lightbox img {
                max-width: 94%;
                max-height: 82vh;
            }

            .lightbox::after {
                top: 12px;
                right: 12px;
            }
        }
    </style>
</head>


<body>

    <h1>NFC Shared Gallery</h1>

    <div
        class="gallery-grid"
        id="photoGrid">
    </div>


    <!-- =====================================================
         LIGHTBOX
         ===================================================== -->

    <div
        id="lightbox"
        class="lightbox">

        <img
            id="lightboxImg"
            src=""
            alt="Enlarged view">

    </div>


    <script>

        /* =====================================================
           GITHUB CONFIGURATION
           ===================================================== */

        const username = "S7LEONNIE";

        const repoName = "testgallery";

        const folderPath = "images/client1";


        /* =====================================================
           ELEMENTS
           ===================================================== */

        const grid =
            document.getElementById("photoGrid");

        const lightbox =
            document.getElementById("lightbox");

        const lightboxImg =
            document.getElementById("lightboxImg");


        /* =====================================================
           GITHUB API
           ===================================================== */

        const apiURL =
            `https://api.github.com/repos/${username}/${repoName}/contents/${folderPath}`;


        /* =====================================================
           IMAGE FORMATS
           ===================================================== */

        const validExtensions = [
            ".jpg",
            ".jpeg",
            ".png",
            ".webp",
            ".gif"
        ];


        /* =====================================================
           LOAD PHOTOS
           ===================================================== */

        async function loadPhotos() {

            try {

                const response =
                    await fetch(apiURL);


                if (!response.ok) {

                    throw new Error(
                        "Failed to load image folder contents."
                    );

                }


                const files =
                    await response.json();


                files.forEach((file, index) => {

                    const isImage =
                        validExtensions.some(
                            ext =>
                                file.name
                                    .toLowerCase()
                                    .endsWith(ext)
                        );


                    if (!isImage) {
                        return;
                    }


                    /* Create image */

                    const img =
                        document.createElement("img");


                    img.src =
                        `${folderPath}/${file.name}`;


                    img.alt =
                        file.name;


                    img.loading =
                        "lazy";


                    /* Staggered loading */

                    img.style.animationDelay =
                        `${index * 0.04}s`;


                    /* =================================================
                       OPEN LIGHTBOX
                       ================================================= */

                    img.addEventListener(
                        "click",
                        () => {

                            lightboxImg.src =
                                img.src;

                            lightboxImg.alt =
                                img.alt;


                            lightbox.classList.add(
                                "active"
                            );


                            /* Stop page scrolling */

                            document.body.style.overflow =
                                "hidden";
                        }
                    );


                    grid.appendChild(img);

                });

            }

            catch (error) {

                console.error(error);

                grid.innerHTML = `
                    <p class="error">
                        Oops! Couldn't load the gallery.
                        Double-check your username
                        and repo layout settings.
                    </p>
                `;
            }
        }


        /* =====================================================
           CLOSE LIGHTBOX
           ===================================================== */

        function closeLightbox() {

            lightbox.classList.remove(
                "active"
            );


            document.body.style.overflow =
                "";


            /*
             * Wait for the closing animation before
             * removing the image.
             */

            setTimeout(() => {

                if (
                    !lightbox.classList.contains(
                        "active"
                    )
                ) {

                    lightboxImg.src = "";
                }

            }, 300);
        }


        /* =====================================================
           CLICK BACKGROUND TO CLOSE
           ===================================================== */

        lightbox.addEventListener(
            "click",
            (event) => {

                /*
                 * Clicking the photo itself should NOT close it.
                 */

                if (
                    event.target === lightbox
                ) {

                    closeLightbox();

                }

            }
        );


        /* =====================================================
           ESC TO CLOSE
           ===================================================== */

        document.addEventListener(
            "keydown",
            (event) => {

                if (
                    event.key === "Escape" &&
                    lightbox.classList.contains("active")
                ) {

                    closeLightbox();

                }

            }
        );


        /* =====================================================
           START
           ===================================================== */

        loadPhotos();

    </script>

</body>
</html>
