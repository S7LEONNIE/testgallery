<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Memories</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: Arial, sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        /* =========================
           PAGE TITLE
        ========================= */

        .page-title {
            text-align: center;
            padding: 30px 20px 20px;
            font-size: 28px;
            font-weight: 600;
        }

        /* =========================
           PHOTO GALLERY
        ========================= */

        .gallery {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 8px 30px;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .gallery img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;

            cursor: pointer;

            opacity: 0;
            transform: translateY(5px);

            transition:
                opacity 0.35s ease,
                transform 0.35s ease;
        }

        .gallery img.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        .gallery img:hover {
            opacity: 0.9;
        }

        /* Tablet */
        @media (min-width: 600px) {
            .gallery {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
                padding-left: 10px;
                padding-right: 10px;
            }
        }

        /* Desktop */
        @media (min-width: 900px) {
            .gallery {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        /* Large desktop */
        @media (min-width: 1300px) {
            .gallery {
                grid-template-columns: repeat(6, 1fr);
                gap: 12px;
            }
        }

        /* =========================
           LIGHTBOX
        ========================= */

        .lightbox {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.94);

            display: none;
            align-items: center;
            justify-content: center;

            z-index: 9999;

            opacity: 0;
        }

        .lightbox.active {
            display: flex;
            opacity: 1;
        }

        /* =========================
           LIGHTBOX CONTENT
        ========================= */

        .lightbox-content {
            position: relative;

            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 70px 80px;
        }

        #lightboxImg {
            max-width: 100%;
            max-height: 100%;

            width: auto;
            height: auto;

            object-fit: contain;

            user-select: none;
            -webkit-user-select: none;

            opacity: 0;
            transform: scale(0.96);

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        #lightboxImg.show {
            opacity: 1;
            transform: scale(1);
        }

        /* =========================
           CLOSE BUTTON
        ========================= */

        .close-button {
            position: absolute;

            top: 18px;
            right: 24px;

            width: 45px;
            height: 45px;

            border: none;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.15);
            color: white;

            font-size: 32px;
            line-height: 1;

            cursor: pointer;

            z-index: 10;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: background 0.2s ease;
        }

        .close-button:hover {
            background: rgba(255, 255, 255, 0.28);
        }

        /* =========================
           NAVIGATION BUTTONS
        ========================= */

        .nav-button {
            position: absolute;

            top: 50%;
            transform: translateY(-50%);

            width: 50px;
            height: 70px;

            border: none;
            border-radius: 10px;

            background: rgba(255, 255, 255, 0.15);
            color: white;

            font-size: 48px;
            line-height: 1;

            cursor: pointer;

            z-index: 10;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: background 0.2s ease;
        }

        .nav-button:hover {
            background: rgba(255, 255, 255, 0.28);
        }

        .prev-button {
            left: 20px;
        }

        .next-button {
            right: 20px;
        }

        /* =========================
           PHOTO COUNTER
        ========================= */

        .photo-counter {
            position: absolute;

            bottom: 20px;
            left: 50%;

            transform: translateX(-50%);

            color: white;

            font-size: 14px;

            background: rgba(0, 0, 0, 0.45);

            padding: 7px 12px;

            border-radius: 20px;

            z-index: 10;
        }

        /* =========================
           MOBILE LIGHTBOX
        ========================= */

        @media (max-width: 600px) {

            .page-title {
                font-size: 24px;
                padding-top: 24px;
            }

            .lightbox-content {
                padding: 60px 15px;
            }

            .nav-button {
                width: 40px;
                height: 55px;

                font-size: 38px;

                background: rgba(255, 255, 255, 0.12);
            }

            .prev-button {
                left: 8px;
            }

            .next-button {
                right: 8px;
            }

            .close-button {
                top: 12px;
                right: 12px;

                width: 40px;
                height: 40px;

                font-size: 28px;
            }

            .photo-counter {
                bottom: 12px;
                font-size: 13px;
            }
        }
    </style>
</head>


<body>

    <!-- =========================
         PAGE TITLE
    ========================= -->

    <div class="page-title">
        Our Memories
    </div>


    <!-- =========================
         PHOTO GALLERY
    ========================= -->

    <div id="gallery" class="gallery"></div>


    <!-- =========================
         LIGHTBOX
    ========================= -->

    <div id="lightbox" class="lightbox">

        <button
            id="closeButton"
            class="close-button"
            aria-label="Close"
        >
            ×
        </button>


        <button
            id="prevButton"
            class="nav-button prev-button"
            aria-label="Previous photo"
        >
            ‹
        </button>


        <div class="lightbox-content">

            <img
                id="lightboxImg"
                src=""
                alt="Enlarged memory"
            >

        </div>


        <button
            id="nextButton"
            class="nav-button next-button"
            aria-label="Next photo"
        >
            ›
        </button>


        <div
            id="photoCounter"
            class="photo-counter"
        >
            1 / 1
        </div>

    </div>


    <script>

        /* =====================================================
           GITHUB SETTINGS
        ===================================================== */

        const username = "S7LEONNIE";

        const repoName = "testgallery";

        const folderPath = "images/client1";


        /* =====================================================
           GALLERY SETTINGS
        ===================================================== */

        const supportedExtensions = [
            ".jpg",
            ".jpeg",
            ".png",
            ".webp",
            ".gif"
        ];


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const gallery =
            document.getElementById("gallery");

        const lightbox =
            document.getElementById("lightbox");

        const lightboxImg =
            document.getElementById("lightboxImg");

        const closeButton =
            document.getElementById("closeButton");

        const prevButton =
            document.getElementById("prevButton");

        const nextButton =
            document.getElementById("nextButton");

        const photoCounter =
            document.getElementById("photoCounter");


        /* =====================================================
           VARIABLES
        ===================================================== */

        let photos = [];

        let currentIndex = 0;


        /* =====================================================
           LOAD PHOTOS FROM GITHUB
        ===================================================== */

        async function loadPhotos() {

            try {

                const apiUrl =
                    `https://api.github.com/repos/${username}/${repoName}/contents/${folderPath}`;

                const response =
                    await fetch(apiUrl);

                if (!response.ok) {
                    throw new Error(
                        `GitHub error: ${response.status}`
                    );
                }

                const files =
                    await response.json();


                /* Keep only image files */

                photos = files.filter(file => {

                    if (file.type !== "file") {
                        return false;
                    }

                    const fileName =
                        file.name.toLowerCase();

                    return supportedExtensions.some(
                        extension =>
                            fileName.endsWith(extension)
                    );

                });


                /* Sort alphabetically */

                photos.sort((a, b) =>
                    a.name.localeCompare(b.name)
                );


                /* Display thumbnails */

                photos.forEach((photo, index) => {

                    const img =
                        document.createElement("img");

                    img.src = photo.download_url;

                    img.alt =
                        `Memory ${index + 1}`;

                    img.loading = "lazy";


                    img.addEventListener(
                        "load",
                        () => {
                            img.classList.add("loaded");
                        }
                    );


                    img.addEventListener(
                        "click",
                        () => {
                            openLightbox(index);
                        }
                    );


                    gallery.appendChild(img);

                });


                /* If there are no photos */

                if (photos.length === 0) {

                    gallery.innerHTML =
                        "<p style='grid-column: 1/-1; text-align:center;'>No photos yet.</p>";

                }

            }

            catch (error) {

                console.error(
                    "Unable to load photos:",
                    error
                );

                gallery.innerHTML =
                    "<p style='grid-column: 1/-1; text-align:center;'>Unable to load photos.</p>";

            }

        }


        /* =====================================================
           OPEN LIGHTBOX
        ===================================================== */

        function openLightbox(index) {

            if (!photos.length) {
                return;
            }


            currentIndex = index;


            updateLightbox();


            lightbox.classList.add("active");


            document.body.style.overflow =
                "hidden";

        }


        /* =====================================================
           UPDATE LIGHTBOX
        ===================================================== */

        function updateLightbox() {

            const photo =
                photos[currentIndex];


            /* Hide current image briefly
               so it animates when changed */

            lightboxImg.classList.remove("show");


            /* Change image */

            lightboxImg.src =
                photo.download_url;

            lightboxImg.alt =
                photo.name;


            /* Counter */

            photoCounter.textContent =
                `${currentIndex + 1} / ${photos.length}`;


            /* Previous button */

            if (currentIndex === 0) {

                prevButton.style.display =
                    "none";

            } else {

                prevButton.style.display =
                    "flex";

            }


            /* Next button */

            if (currentIndex === photos.length - 1) {

                nextButton.style.display =
                    "none";

            } else {

                nextButton.style.display =
                    "flex";

            }


            /* Animate image once loaded */

            lightboxImg.onload = () => {

                requestAnimationFrame(() => {

                    lightboxImg.classList.add(
                        "show"
                    );

                });

            };


            /* Preload previous image */

            if (currentIndex > 0) {

                const previousImage =
                    new Image();

                previousImage.src =
                    photos[currentIndex - 1]
                        .download_url;

            }


            /* Preload next image */

            if (currentIndex < photos.length - 1) {

                const nextImage =
                    new Image();

                nextImage.src =
                    photos[currentIndex + 1]
                        .download_url;

            }

        }


        /* =====================================================
           NEXT PHOTO
        ===================================================== */

        function showNext() {

            if (
                currentIndex <
                photos.length - 1
            ) {

                currentIndex++;

                updateLightbox();

            }

        }


        /* =====================================================
           PREVIOUS PHOTO
        ===================================================== */

        function showPrevious() {

            if (currentIndex > 0) {

                currentIndex--;

                updateLightbox();

            }

        }


        /* =====================================================
           CLOSE LIGHTBOX
        ===================================================== */

        function closeLightbox() {

            lightbox.classList.remove(
                "active"
            );

            document.body.style.overflow =
                "";

            lightboxImg.classList.remove(
                "show"
            );

        }


        /* =====================================================
           BUTTON EVENTS
        ===================================================== */

        closeButton.addEventListener(
            "click",
            closeLightbox
        );


        prevButton.addEventListener(
            "click",
            showPrevious
        );


        nextButton.addEventListener(
            "click",
            showNext
        );


        /* =====================================================
           CLICK DARK BACKGROUND TO CLOSE
        ===================================================== */

        lightbox.addEventListener(
            "click",
            (event) => {

                if (
                    event.target === lightbox
                ) {

                    closeLightbox();

                }

            }
        );


        /* =====================================================
           KEYBOARD CONTROLS
        ===================================================== */

        document.addEventListener(
            "keydown",
            (event) => {

                /* Don't do anything if
                   lightbox isn't open */

                if (
                    !lightbox.classList.contains(
                        "active"
                    )
                ) {

                    return;

                }


                if (
                    event.key === "Escape"
                ) {

                    closeLightbox();

                }


                if (
                    event.key === "ArrowRight"
                ) {

                    showNext();

                }


                if (
                    event.key === "ArrowLeft"
                ) {

                    showPrevious();

                }

            }
        );


        /* =====================================================
           START
        ===================================================== */

        loadPhotos();

    </script>

</body>
</html>
